name: YappifyMobile
options:
  bundleIdPrefix: com.yappify
  deploymentTarget:
    iOS: '16.0'
targets:
  YappifyMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yappify.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Yappify
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yappify
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Allow voice calls in Yapper.
        INFOPLIST_KEY_NSCameraUsageDescription: Allow camera use in Yapper calls and uploads.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    scheme:
      testTargets: []
